apiVersion: apps/v1
kind: Deployment
metadata:
  name: shoppingclient-depl
  labels:
    app: shoppingclient
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: shoppingclient
  template:
    metadata:
      labels:
        app: shoppingclient
    spec:
      containers:
        - name: shoppingclient
          image: shoppingacr.azurecr.io/shoppingclient:v2
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8002
          envFrom:
            - configMapRef:
                name: shoppingclient-config
          resources:
            requests:
              memory: "64Mi"
              cpu: "250m"
            limits:
              memory: "128Mi"
              cpu: "500m"
      imagePullSecrets:
        - name: acr-secret
---
apiVersion: v1
kind: Service
metadata:
  name: shoppingclient-service
  annotations:
    service.beta.kubernetes.io/azure-dns-label-name: shoppingclient-service
spec:
  selector:
    app: shoppingclient
  ports:
    - protocol: TCP
      port: 8002
      targetPort: 8002
  type: LoadBalancer